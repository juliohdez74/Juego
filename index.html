<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Game - TICs</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎮 MEMORY GAME - TICs 🖥️</h1>
            <p class="subtitle">¡Encuentra los pares y gana puntos para tu equipo!</p>
        </header>

        <div class="scoreboard">
            <div class="team team-1">
                <h2>Equipo 1</h2>
                <div class="score" id="team1-score">0</div>
                <button id="btn-team1" class="team-btn active">Seleccionar</button>
            </div>
            
            <div class="game-info">
                <h3>Turno: <span id="current-team">Equipo 1</span></h3>
                <p>Pares encontrados: <span id="pairs-found">0</span>/8</p>
            </div>

            <div class="team team-2">
                <h2>Equipo 2</h2>
                <div class="score" id="team2-score">0</div>
                <button id="btn-team2" class="team-btn">Seleccionar</button>
            </div>
        </div>

        <div class="game-board" id="game-board"></div>

        <div class="controls">
            <button id="reset-btn" class="btn-reset">🔄 Reiniciar Juego</button>
        </div>

        <div id="message" class="message"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
